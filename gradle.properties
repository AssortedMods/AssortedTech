# Project
license=LGPL-3.0-only
issue_tracker=https://github.com/AssortedMods/AssortedTech/issues
family_name=Assorted Tech
# Shared by every mod here. The creative tab, manual section and advancement tab use these.
family_id=assortedtech
family_icons=assortedredstone:flip_flop_torch,assortedbridges:bridge_control_laser,assortedelevators:elevator,assortedgravity:attractor,assortedgrates:iron_item_grate,assortedextruder:iron_extruder,assortedsensors:gold_sensor,assortedspikes:iron_spike,assortedalarm:alarm,assortedfan:fan
family_manual_order=100
# The bundle's first version after the split. Every part refuses to load next to the old mod from before it.
family_split_version=10.0.0
# Every mod in this repo. Each one is a folder under mods.
assorted_mods=tech,elevators,bridges,gravity,grates,extruder,sensors,redstone,alarm,fan,spikes
# Build
# The AssortedBuild version these mods use. It sets the Minecraft, NeoForge and Fabric versions.
assortedbuild_version=26.2.6
# Mod Options
mod_author=Grim3212
# The lowest Assorted Lib version these mods work with.
assortedlib_version=4.3.0
# Build options. Leaving one out turns it off. A mod can turn one on in its own gradle.properties.
jei_enabled=false
client_gametests_enabled=false
neoforge_ats_enabled=false
common_runs_enabled=false
# The default release channel. Can be release, beta or alpha.
release_type=release
# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.configuration-cache=false
